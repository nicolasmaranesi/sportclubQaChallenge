name: SportClub QA - Full Suite

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: sportclub-full-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    name: Jenkins + Docker + Android KVM
    runs-on: ubuntu-24.04
    timeout-minutes: 210

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Comprobar recursos del runner
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          df -h /
          free -h
          command -v jq
          command -v zip

      - name: Habilitar KVM para el emulador Android
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo 'ERROR: KVM no disponible en el runner'; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Preparar configuración temporal de Jenkins
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          {
            printf 'JENKINS_ADMIN_PASSWORD=%s\n' "$password"
            printf 'PROJECT_ROOT=%s\n' "$GITHUB_WORKSPACE"
            printf 'PUID=1000\n'
            printf 'PGID=1000\n'
          } >> "$GITHUB_ENV"
          mkdir -p \
            backend/reports \
            web/reports web/playwright-report web/test-results \
            mobile/reports mobile/e2e/evidence/jenkins \
            stress/reports ci-artifacts
          chmod -R a+rwX \
            backend/reports \
            web/reports web/playwright-report web/test-results \
            mobile/reports mobile/e2e/evidence/jenkins \
            stress/reports ci-artifacts

      - name: Validar y levantar Jenkins
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose up -d --build jenkins

      - name: Esperar inicialización y creación del job
        shell: bash
        run: |
          set -euo pipefail
          url='http://127.0.0.1:8085/job/SportClub-Tests/job/00-Full-Suite/api/json'
          for attempt in $(seq 1 120); do
            if curl --silent --show-error --fail --max-time 5 \
              -u "admin:${JENKINS_ADMIN_PASSWORD}" "$url" > /dev/null 2>&1; then
              echo 'Jenkins inicializó y 00-Full-Suite está disponible.'
              exit 0
            fi
            sleep 5
          done
          echo 'ERROR: Jenkins no logró inicializar el job.' >&2
          exit 1

      - name: Autenticar Jenkins en GHCR
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker compose exec -T jenkins \
            docker login ghcr.io --username "$GHCR_USER" --password-stdin
          docker compose exec -T jenkins docker manifest inspect \
            ghcr.io/nicolasmaranesi/sportclub-android-playstore:13 > /dev/null
          echo 'GHCR: Jenkins autenticado e imagen Android disponible.'

      - name: Ejecutar 00-Full-Suite y esperar resultado
        id: run_suite
        shell: bash
        run: |
          set -euo pipefail
          base='http://127.0.0.1:8085'
          job="$base/job/SportClub-Tests/job/00-Full-Suite"
          cookies="$(mktemp)"
          trap 'rm -f "$cookies"' EXIT

          crumb_json="$(curl --fail --silent --show-error -c "$cookies" \
            -u "admin:${JENKINS_ADMIN_PASSWORD}" "$base/crumbIssuer/api/json")"
          crumb_field="$(jq -r '.crumbRequestField' <<< "$crumb_json")"
          crumb_value="$(jq -r '.crumb' <<< "$crumb_json")"
          test "$crumb_field" != null
          test "$crumb_value" != null

          curl --fail --silent --show-error \
            -u "admin:${JENKINS_ADMIN_PASSWORD}" \
            -b "$cookies" \
            -H "$crumb_field: $crumb_value" \
            -X POST "$job/build?delay=0sec" -o /dev/null

          echo '00-Full-Suite solicitado. Esperando las seis suites...'
          for attempt in $(seq 1 1050); do
            result_json="$(curl --silent --show-error --fail --max-time 8 \
              -u "admin:${JENKINS_ADMIN_PASSWORD}" \
              "$job/lastBuild/api/json?tree=number,building,result" 2>/dev/null || true)"
            if [[ -n "$result_json" ]]; then
              building="$(jq -r '.building' <<< "$result_json")"
              if [[ "$building" == 'false' ]]; then
                result="$(jq -r '.result' <<< "$result_json")"
                echo "Jenkins 00-Full-Suite finalizó con resultado: $result"
                [[ "$result" == 'SUCCESS' ]]
                exit $?
              fi
            fi
            sleep 10
          done
          echo 'ERROR: Se agotó el tiempo de espera de Jenkins.' >&2
          exit 1

      - name: Recuperar logs de Jenkins y de las seis suites
        if: always()
        shell: bash
        run: |
          mkdir -p ci-artifacts
          docker compose logs --no-color jenkins > ci-artifacts/jenkins-container.log 2>&1 || true
          base='http://127.0.0.1:8085/job/SportClub-Tests/job'
          for suite in 00-Full-Suite 01-Backend-API 02-Web-Unit 03-Mobile-Unit 04-Web-E2E 05-Mobile-E2E 06-Performance; do
            curl --silent --show-error --fail --max-time 30 \
              -u "admin:${JENKINS_ADMIN_PASSWORD:-}" \
              "$base/$suite/lastBuild/consoleText" \
              -o "ci-artifacts/$suite.log" || true
          done

      - name: Resumen de los seis pipelines
        id: summary
        if: always()
        shell: bash
        env:
          SUITE_OUTCOME: ${{ steps.run_suite.outcome }}
        run: |
          set -uo pipefail
          mkdir -p ci-artifacts
          case "$SUITE_OUTCOME" in
            success) overall='SUCCESS' ;;
            failure) overall='FAILURE' ;;
            *) overall='INCOMPLETE' ;;
          esac
          printf 'status=%s\n' "$overall" >> "$GITHUB_OUTPUT"

          report_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "# SportClub QA - ${overall}"
            echo
            echo "Ejecución: #${GITHUB_RUN_NUMBER}"
            echo "Repositorio: ${GITHUB_REPOSITORY}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Resultados y evidencias: ${report_url}"
            echo
            echo 'Resultados individuales:'
          } > ci-artifacts/email-body.txt
          {
            echo "### SportClub QA - ${overall}"
            echo
            echo '| Pipeline | Resultado |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

          base='http://127.0.0.1:8085/job/SportClub-Tests/job'
          for suite in 01-Backend-API 02-Web-Unit 03-Mobile-Unit 04-Web-E2E 05-Mobile-E2E 06-Performance; do
            result_json="$(curl --silent --show-error --fail --max-time 10 \
              -u "admin:${JENKINS_ADMIN_PASSWORD:-}" \
              "$base/$suite/lastBuild/api/json?tree=result" 2>/dev/null || true)"
            result='NOT_EXECUTED'
            if [[ -n "$result_json" ]]; then
              result="$(jq -r '.result // "UNKNOWN"' <<< "$result_json" 2>/dev/null || echo UNKNOWN)"
            fi
            printf '%s: %s\n' "$suite" "$result" >> ci-artifacts/email-body.txt
            printf '| %s | %s |\n' "$suite" "$result" >> "$GITHUB_STEP_SUMMARY"
            echo "$suite: $result"
          done
          printf '\nReportes completos disponibles en GitHub Actions -> Artifacts.\n' \
            >> ci-artifacts/email-body.txt

      - name: Preparar ZIP compacto para el correo
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mail-package
          if [[ -f ci-artifacts/email-body.txt ]]; then
            cp ci-artifacts/email-body.txt mail-package/resumen.txt
          else
            echo 'Consultar el resultado de GitHub Actions.' > mail-package/resumen.txt
          fi

          # Adjuntar los JUnit XML y HTML pequeños; videos y capturas quedan como artifacts.
          for folder in backend/reports web/reports mobile/reports mobile/e2e/evidence/jenkins stress/reports; do
            if [[ -d "$folder" ]]; then
              while IFS= read -r -d '' file; do
                cp --parents -- "$file" mail-package/
              done < <(find "$folder" -type f \( -name '*.xml' -o -name '*.html' \) -size -2M -print0)
            fi
          done

          (cd mail-package && zip -qr ../sportclub-qa-report.zip .)
          size="$(stat -c '%s' sportclub-qa-report.zip)"
          if (( size > 15 * 1024 * 1024 )); then
            echo 'ZIP grande: se enviará solo el resumen. Los reportes completos quedan en GitHub.'
            rm -f sportclub-qa-report.zip
            rm -rf mail-package
            mkdir -p mail-package
            cp ci-artifacts/email-body.txt mail-package/resumen.txt
            (cd mail-package && zip -qr ../sportclub-qa-report.zip .)
          fi
          ls -lh sportclub-qa-report.zip

      - name: Publicar reportes y evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportclub-qa-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            ci-artifacts/**
            sportclub-qa-report.zip
            backend/reports/**
            web/reports/**
            web/playwright-report/**
            web/test-results/**
            mobile/reports/**
            mobile/e2e/evidence/**
            stress/reports/**

      - name: Verificar configuración de correo
        id: mail_config
        if: always()
        shell: bash
        env:
          SMTP_USER: ${{ secrets.MAIL_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [[ -n "$SMTP_USER" && -n "$SMTP_PASSWORD" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::No se envió correo: faltan MAIL_USERNAME o MAIL_PASSWORD en GitHub Secrets.'
          fi

      - name: Enviar resultados por Gmail
        if: ${{ always() && steps.mail_config.outputs.enabled == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 'SportClub QA <${{ secrets.MAIL_USERNAME }}>'
          to: nicolas.maranesi@gmail.com
          subject: 'SportClub QA - ${{ steps.summary.outputs.status }} - Ejecución #${{ github.run_number }}'
          body: file://ci-artifacts/email-body.txt
          attachments: sportclub-qa-report.zip
