
appId: com.muvinai.carnet2
---
- launchApp:
    clearState: false

- runFlow:
    when:
      visible:
        id: "button-omitir"
    commands:
      - tapOn:
          id: "button-omitir"

- runFlow:
    when:
      visible: "Ingreso sin registro"
    commands:
      - tapOn: "Ingreso sin registro"

- extendedWaitUntil:
    visible: "Sedes"
    timeout: 45000

- tapOn: "Sedes"
