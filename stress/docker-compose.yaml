
services:
  jmeter:
    image: sportclub/jmeter:local

    build:
      context: .
      dockerfile: docker/Dockerfile

    working_dir: /work/stress
    init: true

    user: "${PUID:-1000}:${PGID:-1000}"

    volumes:
      - ./reports:/work/stress/reports

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |
        RUN_ID="run-$$(date -u +%Y%m%dT%H%M%S)-$$$$"
        OUT_DIR="/work/stress/reports/$$RUN_ID"

        mkdir -p "$$OUT_DIR"

        echo "Ejecutando QuickPizza - carga moderada"

        jmeter -n \
          -t /work/stress/plans/quickpizza.jmx \
          -l "$$OUT_DIR/results.jtl" \
          -j "$$OUT_DIR/jmeter.log" \
          -e -o "$$OUT_DIR/dashboard" \
          -JVUS=2 \
          -JDURATION_SECONDS=30 \
          -JRAMP_UP_SECONDS=10 \
          -JTHINK_TIME_MS=2000 \
          -Jjmeter.save.saveservice.output_format=csv \
          -Jjmeter.save.saveservice.print_field_names=true \
          -Jjmeter.save.saveservice.latency=true \
          -Jjmeter.save.saveservice.connect_time=true

        echo "Resultados: $$OUT_DIR"
        echo "Dashboard: $$OUT_DIR/dashboard/index.html"

    restart: "no"
